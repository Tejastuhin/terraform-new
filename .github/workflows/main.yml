name: CI/CD

on:
  push:
    branches:
      - main

jobs:
  build-test-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: pytest

            - name: Test Docker Hub authentication
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
        run: |
          STATUS=$(curl -s -o /tmp/docker-auth-response.json -w "%{http_code}" \
            -u "$DOCKER_USERNAME:$DOCKER_PASSWORD" \
            "https://auth.docker.io/token?service=registry.docker.io&scope=repository:tejastuhin/flask-app:pull,push")

          echo "Docker Hub authentication HTTP status: $STATUS"

          if [ "$STATUS" != "200" ]; then
            echo "Docker Hub rejected the credentials."
            cat /tmp/docker-auth-response.json
            exit 1
          fi

          echo "Docker Hub credentials accepted."
          
      - name: Build Docker image
        run: docker build -t tejastuhin/flask-app:${{ github.sha }} .

      - name: Push Docker image
        run: docker push tejastuhin/flask-app:${{ github.sha }}